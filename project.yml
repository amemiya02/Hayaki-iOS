# The Xcode project is generated from this file with XcodeGen:
#     xcodegen generate
# Hayaki.xcodeproj is ignored by git; edit this file, never the project.
#
# The app target is a thin entry point. Nearly all code lives in the local
# Swift packages under Packages/; AppShell pulls in the feature packages.
name: Hayaki

options:
  bundleIdPrefix: io.github.amemiya02
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

# Every local package is listed so all of them show up, editable, in Xcode.
packages:
  AnkiCore:
    path: Packages/AnkiCore
  CollectionStore:
    path: Packages/CollectionStore
  AppShell:
    path: Packages/AppShell
  HayakiAppearance:
    path: Packages/HayakiAppearance
  DecksFeature:
    path: Packages/DecksFeature
  BrowseFeature:
    path: Packages/BrowseFeature
  StatisticsFeature:
    path: Packages/StatisticsFeature
  SettingsFeature:
    path: Packages/SettingsFeature
  PackagesFeature:
    path: Packages/PackagesFeature
  NoteEditorFeature:
    path: Packages/NoteEditorFeature
  StudyFeature:
    path: Packages/StudyFeature
  DeckOptionsFeature:
    path: Packages/DeckOptionsFeature
  SyncFeature:
    path: Packages/SyncFeature
  ReminderFeature:
    path: Packages/ReminderFeature

  ExtensionBridge:
    path: Packages/ExtensionBridge

targets:
  Hayaki:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: AppShell
      - target: HayakiShare
        embed: true
      - target: HayakiWidgets
        embed: true
    postBuildScripts:
      - name: Record build diagnostics
        script: /bin/bash "$SRCROOT/scripts/stamp-app-build.sh"
        inputFiles:
          - $(SRCROOT)/core/Cargo.lock
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
          - $(SRCROOT)/scripts/stamp-app-build.sh
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/HayakiBuildInfo.plist
    settings:
      base:
        PRODUCT_NAME: Hayaki
        # Fixed permanently, even if the display name ever changes.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.amemiya02.hayaki
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: "13"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # The core's simulator slice is arm64 only (Apple silicon), so never
        # build the Intel simulator slice that a generic destination asks for.
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        GENERATE_INFOPLIST_FILE: YES
        # Document types (Anki packages) that build settings cannot express.
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Extensions/AppGroup.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Hayaki
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        # A sync server the learner enters may be on their local network.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Hayaki connects to the sync server you enter, which may be on your local network.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        CODE_SIGN_STYLE: Automatic
        # Assign the same team to all iOS targets when signing the extensions.
        DEVELOPMENT_TEAM: ""

  HayakiShare:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/Share
    dependencies:
      - package: ExtensionBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.amemiya02.hayaki.share
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: "13"
        TARGETED_DEVICE_FAMILY: "1,2"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Extensions/Share/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Hayaki
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Extensions/AppGroup.entitlements
        SKIP_INSTALL: YES

  HayakiWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/Widgets
    dependencies:
      - package: ExtensionBridge
      - package: HayakiAppearance
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.amemiya02.hayaki.widgets
        MARKETING_VERSION: "0.3.1"
        CURRENT_PROJECT_VERSION: "13"
        TARGETED_DEVICE_FAMILY: "1,2"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Extensions/Widgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Hayaki
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Extensions/AppGroup.entitlements
        SKIP_INSTALL: YES

  # UI tests of the assembled app in the simulator; run them with
  #     xcodebuild test -scheme Hayaki -destination 'platform=iOS Simulator,name=iPhone 17'
  HayakiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
        excludes: [Fixtures]
      - path: UITests/Fixtures/template-scripts.colpkg
        buildPhase: resources
      # The app starts the tests from a copy of this real collection package.
      - path: Packages/CollectionStore/Sources/CollectionTesting/Fixtures/collection.colpkg
        buildPhase: resources
    dependencies:
      - target: Hayaki
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.amemiya02.hayaki.uitests
        GENERATE_INFOPLIST_FILE: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  Hayaki:
    build:
      targets:
        Hayaki: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HayakiUITests
    archive:
      config: Release
